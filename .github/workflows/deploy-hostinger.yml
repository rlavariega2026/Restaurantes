name: Deploy Restaurantes to Hostinger
# FTP deployment is restricted to /public_html/Restaurantes/.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restaurantes-hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build static application
        run: npm run build

      - name: TypeScript validation
        run: npm run lint

      - name: Include PHP API and rewrite rules in deploy bundle
        run: |
          test -s dist/index.html
          cp public/api.php dist/api.php
          cp public/.htaccess dist/.htaccess
          test -s dist/api.php
          test -s dist/.htaccess
          php -l dist/api.php
          for name in lav-security.php lav-auth.php lav-publish.php lav-media.php; do
            test -s "dist/$name"
            php -l "dist/$name"
          done
          test -s dist/lav-logo-original.svg
          printf '{"commit":"%s"}\\n' "$GITHUB_SHA" > dist/lav-version.json


      - name: Deploy only dist to the Restaurantes directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/lavdigitalagency.com/public_html/Restaurantes/
          dangerous-clean-slate: false

      - name: Verify live application and writable PHP API
        run: |
          curl --retry 8 --retry-delay 3 --retry-connrefused -fsS https://lavdigitalagency.com/Restaurantes/ -o /tmp/restaurantes-index.html
          test -s /tmp/restaurantes-index.html
          API_RESPONSE="$(curl --retry 8 --retry-delay 3 --retry-connrefused -fsS https://lavdigitalagency.com/Restaurantes/api/health)"
          echo "$API_RESPONSE"
          echo "$API_RESPONSE" | grep -q '"success":true'
          echo "$API_RESPONSE" | grep -q '"storage_writable":true'
          curl --retry 8 --retry-delay 3 -fsS https://lavdigitalagency.com/Restaurantes/lav-version.json -o /tmp/lav-version.json
          grep -Fq "$GITHUB_SHA" /tmp/lav-version.json
          curl -fsS https://lavdigitalagency.com/Restaurantes/lav-auth.php?action=status -o /tmp/lav-auth-status.json
          php -r '$v=json_decode(file_get_contents("/tmp/lav-auth-status.json"),true);if(empty($v["success"])||!array_key_exists("authenticated",$v))exit(1);'
          curl -fsS https://lavdigitalagency.com/Restaurantes/lav-logo-original.svg -o /tmp/lav-real-logo.svg
          grep -q '<svg' /tmp/lav-real-logo.svg
          echo "Verified commit, live auth, API and real LAV original image over HTTPS"
